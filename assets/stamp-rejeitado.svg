<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 70" width="200" height="70">
  <defs>
    <filter id="distress-rej">
      <feTurbulence type="fractalNoise" baseFrequency="0.1" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5"/>
    </filter>
  </defs>
  <g transform="rotate(5 100 35)" filter="url(#distress-rej)">
    <rect x="5" y="5" width="190" height="60" rx="3" fill="none" stroke="#e42232" stroke-width="5" stroke-dasharray="14 4 22 2"/>
    <text x="100" y="32" font-family="'Impact', sans-serif" font-size="28" fill="#e42232" letter-spacing="3" text-anchor="middle">✕ REJEITADO</text>
    <text x="100" y="52" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#e42232" letter-spacing="2" text-anchor="middle">ARQUIVAMENTO PLENÁRIO</text>
  </g>
</svg>