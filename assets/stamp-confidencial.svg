  <defs>
    <filter id="distress" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <g transform="rotate(-4 140 45)" filter="url(#distress)">
    <!-- Outer dashed double border -->
    <rect x="6" y="6" width="268" height="78" rx="4" fill="none" stroke="#e42232" stroke-width="4.5" stroke-dasharray="14 3 20 4 8 2"/>
    <rect x="12" y="12" width="256" height="66" rx="2" fill="none" stroke="#e42232" stroke-width="2" stroke-opacity="0.85"/>
    <!-- Stamp text -->
    <text x="140" y="32" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="12" fill="#e42232" letter-spacing="4" text-anchor="middle">★ AUDITORIA CÍVICA ★</text>
    <text x="140" y="58" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#e42232" letter-spacing="2" text-anchor="middle">CONFIDENCIAL</text>
    <text x="140" y="73" font-family="'Courier New', monospace" font-weight="700" font-size="9" fill="#e42232" letter-spacing="3" text-anchor="middle">LEI DE ACESSO À INFORMAÇÃO N° 12.527</text>
  </g>
</svg>