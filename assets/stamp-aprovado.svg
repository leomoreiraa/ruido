<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 70" width="200" height="70">
  <defs>
    <filter id="distress-gr">
      <feTurbulence type="fractalNoise" baseFrequency="0.1" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/>
    </filter>
  </defs>
  <g transform="rotate(-6 100 35)" filter="url(#distress-gr)">
    <rect x="5" y="5" width="190" height="60" rx="3" fill="none" stroke="#22c55e" stroke-width="4.5" stroke-dasharray="16 3 24 3"/>
    <text x="100" y="32" font-family="'Impact', sans-serif" font-size="28" fill="#22c55e" letter-spacing="3" text-anchor="middle">✓ APROVADO</text>
    <text x="100" y="52" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#22c55e" letter-spacing="2" text-anchor="middle">CONGRESSO NACIONAL</text>
  </g>
</svg>